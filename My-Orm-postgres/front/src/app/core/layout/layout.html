<p-toast position="top-right" />
<p-confirmdialog [style]="{ width: '28rem' }" [breakpoints]="{ '640px': '92vw' }" />

<header class="border-b border-surface-200 bg-surface-0">
  <div class="mx-auto flex h-16 max-w-6xl items-center gap-6 px-4">
    <a routerLink="/" class="flex items-center gap-2 text-lg font-semibold text-surface-900">
      <i class="pi pi-database text-primary"></i>
      My ORM
    </a>

    <nav class="flex gap-1 text-sm">
      <a
        routerLink="/clientes"
        routerLinkActive="bg-primary-50 text-primary"
        class="rounded-md px-3 py-2 font-medium text-surface-600 hover:bg-surface-100"
      >
        Clientes
      </a>
    </nav>
  </div>
</header>

<main class="mx-auto max-w-6xl px-4 py-8">
  <router-outlet></router-outlet>
</main>
